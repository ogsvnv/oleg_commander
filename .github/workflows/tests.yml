name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install package and test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Ruff checks (updated modules)
        run: >-
          ruff check
          src/oleg_commander/config.py
          src/oleg_commander/tools/ssh.py
          src/oleg_commander/tools/systemd.py
          src/oleg_commander/tools/docker.py
          src/oleg_commander/tools/processes.py
          src/oleg_commander/services/command_service.py
          src/oleg_commander/services/secure_filesystem.py
          src/oleg_commander/tools/filesystem.py
          tests/test_filesystem_boundaries.py
          tests/test_mcp_transport.py
          src/oleg_commander/tool_result.py
          src/oleg_commander/audit.py
          src/oleg_commander/services/approval_service.py
          tests/test_approval_audit.py
          tests/test_ssh_integration.py
          tests/test_local_diagnostics.py
      - name: Compile source
        run: python -m compileall -q src tests
      - name: Run unit tests
        run: python -m pytest -q
